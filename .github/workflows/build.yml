
name: Build Half-Life for GoodLuckOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        run: docker buildx build --output type=local,dest=./out .

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: half-life-port
          path: out/half-life-port.zip
